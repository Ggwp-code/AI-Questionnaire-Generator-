[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tribunal"
version = "0.2.0"
description = "Multi-subject exam paper generation with source-backed questions and faculty approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.165",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "regex>=2024.5",
  "numpy>=1.26",
  "pypdfium2>=4.30",
  "pypdf>=4.3",
  "pillow>=10.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "langgraph>=0.2",
  "fpdf2>=2.7.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
s3 = ["boto3>=1.34"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
ocr = ["ocrmypdf>=16"]
layout = ["docling>=2"]
embeddings-local = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tribunal = "tribunal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tribunal = ["migrations/*.ini", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
