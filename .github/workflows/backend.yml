name: backend

on:
  push:
    paths: ["backend/**", "docs/**", "deploy/**", ".dockerignore", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/**", "deploy/**", ".dockerignore", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev,openai,s3]"
      - run: ruff check backend
      - run: cd backend && pytest
      - run: tribunal scan-text --config backend/config/runtime.example.yaml backend docs deploy

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -f deploy/api.Dockerfile -t tribunal-api .
      - run: docker build --platform linux/amd64 -f deploy/ingest.Dockerfile -t tribunal-ingest .
      - run: docker run --rm tribunal-api tribunal --help
      - run: docker run --rm tribunal-ingest ocrmypdf --version
      - run: docker run --rm tribunal-ingest tesseract --list-langs | tee langs.txt
      - run: grep -qx eng langs.txt && grep -qx hin langs.txt
      - run: docker run --rm tribunal-ingest test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: docker run --rm tribunal-ingest test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
