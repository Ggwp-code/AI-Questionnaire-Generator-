name: backend

on:
  push:
    paths: ["backend/**", "docs/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev,openai,s3]"
      - run: ruff check backend
      - run: cd backend && pytest
      - run: tribunal scan-text --config backend/config/runtime.example.yaml backend docs
